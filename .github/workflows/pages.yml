name: Publish APT repository to Pages

# Serves only the APT repository: dists/stable/... and the .deb files.
#
# There is deliberately no index.html. A Pages site without one returns 404 at
# the root, so the tree is not browsable by hand, and robots.txt disallows
# everything for crawlers. That is as close to "only apt can read this" as
# GitHub Pages allows: gh.io has no authentication, so any file served here is
# technically public. Real access restriction would need a different host.
#
# This replaced the legacy Jekyll build, which cannot be used here: it walks
# the repository root and calls realpath() on every symlink, so it aborts on
# the first dangling one. This repository tracks symlinks into
# .upstream-packages/, which is fetched at build time and so never present in a
# checkout. Upstream also ships one already-dangling link of its own, in
# disabled-packages/protobuf-static/retain-linker-array.patch, which broke the
# legacy build before this fork had any changes.

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Prebuilt android/arm64 binary, published by kaozaza2/opencode-termux.
  # Termux's cross toolchain needs an x64 host and tens of GB of disk, so the
  # binary is taken from the release and only wrapped as a .deb here.
  OPENCODE_VERSION: "2.0.18"
  OPENCODE_RELEASE_URL: "https://github.com/kaozaza2/opencode-termux/releases/download/2.0.18-termux/opencode-termux-2.0.18.tar.gz"

jobs:
  build:
    name: Build debs and generate repository index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Build opencode .deb
        # A failure here must not publish a half-built repository; the verify
        # step below turns it into a red run instead of a silent 404.
        continue-on-error: true
        run: |
          set -eu
          mkdir -p build debs
          curl -fsSL --retry 3 -o build/opencode.tar.gz "$OPENCODE_RELEASE_URL"
          tar xzf build/opencode.tar.gz -C build
          test -f build/opencode
          ./scripts/package-prebuilt.sh \
            build/opencode "$OPENCODE_VERSION" debs opencode

      - name: Verify deb install paths
        # A Termux deb must carry the absolute path ./data/data/com.termux/
        # files/usr/... in data.tar, because Termux's dpkg is a stock dpkg with
        # root "/". A $PREFIX-relative ./bin/<name> entry would install into
        # /bin, so assert the real path rather than trusting the script.
        run: |
          set -eu
          if ! ls debs/*.deb >/dev/null 2>&1; then
            echo "no .deb to check"
            exit 0
          fi
          fail=0
          contents="$(mktemp)"
          for deb in debs/*.deb; do
            echo "--- $deb"
            ar t "$deb"
            ar p "$deb" data.tar.xz | tar -tJf - | tee "$contents"
            if grep -q '^\./data/data/com\.termux/files/usr/bin/' "$contents"; then
              echo "ok      installs under the Termux prefix"
            else
              echo "BAD     no ./data/data/com.termux/files/usr/bin/ entry"
              fail=1
            fi
            if grep -q '^\./bin/' "$contents"; then
              echo "BAD     contains a /bin entry; would install outside the prefix"
              fail=1
            fi
          done
          exit $fail

      - name: Generate APT repository
        # The official generator, fetched as a single file rather than pip
        # installed: it is one script, and this avoids PEP 668 on the runner.
        continue-on-error: true
        run: |
          set -eu
          if ! ls debs/*.deb >/dev/null 2>&1; then
            echo "no .deb built; nothing to publish"
            exit 0
          fi
          curl -fsSL --retry 3 -o /tmp/termux-apt-repo \
            https://raw.githubusercontent.com/termux/termux-apt-repo/v0.5/termux-apt-repo
          python3 /tmp/termux-apt-repo debs _site stable main

      - name: Discourage crawlers
        run: |
          set -eu
          mkdir -p _site
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: Verify repository layout
        run: |
          set -eu
          fail=0
          for p in dists/stable/Release \
                   dists/stable/main/binary-aarch64/Packages \
                   dists/stable/main/binary-aarch64/Packages.xz \
                   robots.txt; do
            if [ -f "_site/$p" ]; then
              echo "ok      /$p"
            else
              echo "MISSING /$p"
              fail=1
            fi
          done
          if ls _site/dists/stable/main/binary-aarch64/*.deb >/dev/null 2>&1; then
            echo "ok      /dists/stable/main/binary-aarch64/*.deb"
          else
            echo "MISSING no .deb published"
            fail=1
          fi
          # No human-facing index, by request.
          if [ -e _site/index.html ]; then
            echo "UNEXPECTED /index.html exists; the site is meant to be apt-only"
            fail=1
          else
            echo "ok      no index.html (root 404s by design)"
          fi
          echo "--- published tree ---"
          find _site -type f | sort
          exit $fail

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
